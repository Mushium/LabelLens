<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">LabelLens — Your images. Your classes. Your classifier.</title>
  <desc id="desc">A dark navy cover with mint and blue accents showing the three steps: upload, train, predict.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#75edc5"/><stop offset="1" stop-color="#7eaaff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#254c64" stop-opacity=".65"/><stop offset="1" stop-color="#0d1523" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="420" rx="24" fill="#0d1523"/>
  <ellipse cx="1040" cy="170" rx="360" ry="340" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="418" rx="23" fill="none" stroke="#293c50"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="76" fill="#86d7c3" font-size="13" font-weight="700" letter-spacing="3">IMAGE CLASSIFICATION, FROM DATA TO DEMO</text>
    <text x="60" y="174" fill="#f5f8ff" font-size="76" font-weight="700" letter-spacing="-3">LabelLens</text>
    <text x="64" y="227" fill="#c4d2e4" font-size="25">Your images. Your classes. Your classifier.</text>
    <text x="64" y="267" fill="#91a5bd" font-size="18">Build and test custom image classifiers in your browser.</text>
    <rect x="64" y="320" width="86" height="34" rx="17" fill="#19283a"/><text x="107" y="342" text-anchor="middle" fill="#c4d2e4" font-size="13">React</text>
    <rect x="160" y="320" width="86" height="34" rx="17" fill="#19283a"/><text x="203" y="342" text-anchor="middle" fill="#c4d2e4" font-size="13">Flask</text>
    <rect x="256" y="320" width="122" height="34" rx="17" fill="#19283a"/><text x="317" y="342" text-anchor="middle" fill="#c4d2e4" font-size="13">TensorFlow</text>
    <rect x="388" y="320" width="140" height="34" rx="17" fill="#19283a"/><text x="458" y="342" text-anchor="middle" fill="#c4d2e4" font-size="13">Cloud Storage</text>
    <g transform="translate(905 72)">
      <rect x="-20" y="-12" width="210" height="180" rx="22" fill="#142337" stroke="#2e455d" transform="rotate(-9 85 78)"/>
      <rect width="210" height="180" rx="22" fill="#192c40" stroke="#46647c"/>
      <rect x="24" y="24" width="162" height="112" rx="12" fill="#0d1b2c"/>
      <circle cx="146" cy="50" r="12" fill="#7eaaff"/>
      <path d="M38 120 L80 66 L111 102 L133 80 L175 120 Z" fill="url(#accent)"/>
      <rect x="25" y="151" width="74" height="5" rx="2.5" fill="#75edc5"/>
      <rect x="108" y="151" width="49" height="5" rx="2.5" fill="#39516a"/>
      <path d="M-38 48 V-36 H40 M172 -36 H248 V48 M248 132 V216 H172 M40 216 H-38 V132" fill="none" stroke="#75edc5" stroke-width="3" opacity=".65"/>
    </g>
    <text x="1010" y="344" text-anchor="middle" fill="#bbd4df" font-size="16" letter-spacing="2">UPLOAD → TRAIN → PREDICT</text>
  </g>
</svg>
